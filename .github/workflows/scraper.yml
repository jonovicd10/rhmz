name: RHMZ Weather Scraper

on:
  schedule:
    # Pokrece se na svakih 20 minuta
    - cron: '*/20 * * * *'
  workflow_dispatch: # Omogucava i rucno pokretanje na dugme u GitHub-u

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v3

      - name: Podesavanje Python okruženja
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalacija zavisnosti
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 supabase

      - name: Pokretanje scraper-a
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scraper.py